name: SPAD WhatsApp Market Feature Syntax Checks
on:
  push:
    branches:
      - feature/whatsapp-market-publisher-20261109
  pull_request:
    paths:
      - 'app/Services/SpadWhatsAppMarketPublisher.php'
      - 'app/Http/Controllers/Admin/SpadWhatsAppMarketController.php'
      - 'app/Console/Commands/PublishSpadWhatsAppMarket.php'
      - 'database/migrations/2026_11_09_150000_create_spad_whatsapp_market.php'
      - 'app/Console/Kernel.php'
      - 'routes/api.php'
      - 'routes/admin/whatsapp-market.php'
      - '.github/workflows/whatsapp-market-lint.yml'
permissions:
  contents: read
jobs:
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Lint feature files
        run: |
          set -euo pipefail
          for file in \
            app/Services/SpadWhatsAppMarketPublisher.php \
            app/Http/Controllers/Admin/SpadWhatsAppMarketController.php \
            app/Console/Commands/PublishSpadWhatsAppMarket.php \
            database/migrations/2026_11_09_150000_create_spad_whatsapp_market.php \
            routes/admin/whatsapp-market.php \
            app/Console/Kernel.php \
            routes/api.php; do
            php -l "$file"
          done
