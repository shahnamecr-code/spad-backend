name: SPAD Market Intelligence — CI
on:
  pull_request:
    paths:
      - 'ops/market-intelligence/**'
      - '.github/workflows/spad-market-intelligence-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops/market-intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app scripts
      - run: python -m pytest tests -q
      - run: docker compose -f compose.yml config --quiet
        env:
          POSTGRES_PASSWORD: ci-nonsecret-placeholder
          INGEST_API_KEY: ci-nonsecret-placeholder-long-enough
          GRAFANA_ADMIN_PASSWORD: ci-nonsecret-placeholder
