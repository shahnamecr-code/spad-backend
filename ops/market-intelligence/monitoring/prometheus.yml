global:
  scrape_interval: 30s
  evaluation_interval: 30s
scrape_configs:
  - job_name: market-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: host
    static_configs:
      - targets: ["node-exporter:9100"]
rule_files: ["/etc/prometheus/alerts.yml"]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
